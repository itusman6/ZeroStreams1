
name: Refresh live playlist

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'metadata.py'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/refresh-playlist.yml'

permissions:
  contents: write

concurrency:
  group: playlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test parser
        run: python -m unittest discover -s tests -v

      - name: Generate playlist
        run: python scraper.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-diagnostics
          path: status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit playlist and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -f -- playlist.m3u status.json

          if git diff --cached --quiet; then
            echo 'No playlist or diagnostic changes to commit.'
            exit 0
          fi

          git commit -m 'Refresh live playlist'
          git push
