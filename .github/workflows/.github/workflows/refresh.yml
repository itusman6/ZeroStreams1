name: Refresh live playlist

on:
  schedule:
    # Off-peak minute (avoids the congested :00 slot where runs get delayed/dropped)
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'metadata.py'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write
  actions: write   # needed for the keepalive step below

concurrency:
  group: playlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test parser
        run: python -m unittest discover -s tests -v

      - name: Generate playlist
        run: python scraper.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-diagnostics
          path: |
            status.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only commit playlist changes (status.json changes every run, so it is not a trigger)
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo 'Playlist unchanged; skipping repository update.'
          else
            git commit -m 'Refresh live playlist'
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # Prevents GitHub from auto-disabling the schedule after 60 days of no repo activity
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh.yml --repo "$GITHUB_REPOSITORY" || true
